theme: jekyll-theme-slate
title: The Bear's Den
author: Jörg Sommrey
description: Enter at your own risk
url: https://github.sommrey.de
base_url: /the-bears-den
HttpClient:
  Timeout: 10
remote_theme: pages-themes/slate@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-paginate
- jekyll-sitemap
paginate: 12
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      challenge_url: "https://theweeklychallenge.org/blog/perl-weekly-challenge"
      solution_url: "https://github.com/manwar/perlweeklychallenge-club/blob/master"
  -
    scope:
      path: "content"
    values:
      layout: "default"
      type: "pages"
